
# YOLOv8n Custom: P2 + P3 + P4 Detection (No P5)

nc: 6

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4
  - [-1, 3, C2f, [128, True]]      # 2  P2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8
  - [-1, 6, C2f, [256, True]]      # 4  P3
  - [-1, 1, Conv, [512, 3, 2]]     # 5  P4/16
  - [-1, 6, C2f, [512, True]]      # 6  P4
  - [-1, 1, Conv, [1024, 3, 2]]    # 7  P5/32
  - [-1, 3, C2f, [1024, True]]     # 8  P5
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  # P3 → P2 (NEW)
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]   # P2

  # P2 → P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]   # P3 refined

  # P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]   # P4 refined

  # Detect
  - [[18, 21, 24], 1, Detect, [nc]]

