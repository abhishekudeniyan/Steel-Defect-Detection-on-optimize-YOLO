# models/yolov8n_spd_p3_p4.yaml

# YOLOv8n with SPDConv replacing P3 downsampling and P4
nc: 6

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # → 16
  - [-1, 1, Conv, [128, 3, 2]]     # → 32
  - [-1, 3, C2f, [128, True]]      # → 32

  # 🔥 SPD at P3
  - [-1, 1, SPDConv, [32, 32]]
  - [-1, 6, C2f, [128, True]]      # → 32

  # 🔥 SPD at P4
  - [-1, 1, SPDConv, [32, 32]]     # careful here
  - [-1, 6, C2f, [256, True]]      # → 64

  - [-1, 1, Conv, [512, 3, 2]]     # → 128
  - [-1, 3, C2f, [512, True]]      # → 128

  - [-1, 1, SPPF, [512, 5]]        # → 128

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]