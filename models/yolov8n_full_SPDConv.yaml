

nc: 6

scales:
  n: [0.33, 0.25, 1024]

backbone:
  # ── Standard YOLOv8n layers 0-2 (unchanged) ──────────────────────────────
  - [-1, 1, Conv,   [64,  3, 2]]      # 0: 3→16ch,  320×320
  - [-1, 1, SPDConv,   [128]]      # 1: 16→32ch, 160×160
  - [-1, 3, C2f,    [128, True]]      # 2: 32→32ch, 160×160

  # ── SPDConv replaces Conv[256,3,2] at P3 ─────────────────────────────────

  # Params: Conv2d(128,64,1) = 8,192 vs standard Conv2d(32,64,3)=18,432 → 56% reduction
  - [-1, 1, SPDConv, [256]]        # 3: 32→64ch, 80×80  ✓ FIXED

  - [-1, 6, C2f,    [256 , True]]      # 4: 64→64ch, 80×80  ← P3 feature map
  
  # ── Standard P4, P5, SPPF (completely unchanged) ─────────────────────────
  - [-1, 1, SPDConv,   [512]]     # 5: 64→128ch,  40×40
  - [-1, 6, C2f,    [512,  True]]     # 6: 128→128ch, 40×40 ← P4 feature map
  - [-1, 1, SPDConv,   [1024]]     # 7: 128→256ch, 20×20
  - [-1, 3, C2f,    [1024, True]]     # 8: 256→256ch, 20×20
  - [-1, 1, SPPF,   [1024, 5]]        # 9: 256→256ch, 20×20

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 10: 256ch, 40×40
  - [[-1, 6], 1, Concat, [1]]                     # 11: 256+128=384ch, 40×40
  - [-1, 3, C2f, [512]]                            # 12: →128ch, 40×40

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13: 128ch, 80×80
  - [[-1, 4], 1, Concat, [1]]                     # 14: 128+64=192ch, 80×80
  - [-1, 3, C2f, [256]]                            # 15: →64ch  ← P3 detect

  - [-1, 1, Conv, [256, 3, 2]]                     # 16: 64ch, 40×40
  - [[-1, 12], 1, Concat, [1]]                     # 17: 64+128=192ch
  - [-1, 3, C2f, [512]]                            # 18: →128ch ← P4 detect

  - [-1, 1, Conv, [512, 3, 2]]                     # 19: 128ch, 20×20
  - [[-1, 9], 1, Concat, [1]]                      # 20: 128+256=384ch
  - [-1, 3, C2f, [1024]]                           # 21: →256ch ← P5 detect

  - [[15, 18, 21], 1, Detect, [nc]]