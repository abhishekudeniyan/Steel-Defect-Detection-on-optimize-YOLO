# models/yolov8n_spdhybrid_p3.yaml

nc: 6

scales:
  n: [0.33, 0.25, 1024]

backbone:
  # ---- Standard ----
  # Stem
  - [-1, 1, DKStem, [64]]               # 0-P1/2  (64 * 0.25 = 16 channels)
  - [-1, 1, Conv, [128, 3, 2]]     # 16 → 32
  - [-1, 3, C2f, [128, True]]      # 32 → 32

  # 🔥 P3 Downsample replaced
  - [-1, 1, Conv, [256,3,2]]      # base 256 → nano = 64

  - [-1, 6, C2f, [256, True]]      # 64 → 64  (P3)

  # ---- Rest unchanged ----
  - [-1, 1, Conv, [512, 3, 2]]     # 64 → 128
  - [-1, 6, C2f, [512, True]]      # 128 → 128 (P4)

  - [-1, 1, Conv, [1024, 3, 2]]    # 128 → 256
  - [-1, 3, C2f, [1024, True]]     # 256 → 256

  - [-1, 1, SPPF, [1024, 5]]       # 256 → 256


head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]