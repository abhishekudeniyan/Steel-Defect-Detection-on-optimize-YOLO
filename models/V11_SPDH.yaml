# Custom Ultralytics YOLOv11n Architecture
# Upgraded with DKStem, SPDHybrid, C3k2, and C2PSA

nc: 6 # Adjust based on your dataset class count

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # Updated to official YOLOv11 depth factor

# =========================
# BACKBONE
# =========================
backbone:
  # Stem
  # Stem
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2         # 0-P1/2  (64 * 0.25 = 16 channels)

  # P2
  - [-1, 1, SPDHybrid, [128]]           # 1-P2/4  (128 * 0.25 = 32 channels)
  - [-1, 2, C3k2, [128, True]]          # 2

  # P3
  - [-1, 1, SPDHybrid, [256]]           # 3-P3/8  (256 * 0.25 = 64 channels)
  - [-1, 4, C3k2, [256, True]]          # 4  <-- P3 Feature Map

  # P4
  - [-1, 1, SPDHybrid, [512]]           # 5-P4/16 (512 * 0.25 = 128 channels)
  - [-1, 4, C3k2, [512, True]]          # 6  <-- P4 Feature Map

  # P5
  - [-1, 1, SPDHybrid, [1024]]          # 7-P5/32 (1024 * 0.25 = 256 channels)
  - [-1, 2, C3k2, [1024, True]]         # 8

  # Pooling & Attention (Standard YOLOv11 Pipeline)
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 1, C2PSA, [1024]]              # 10 <-- Top Backbone Feature Map


# =========================
# HEAD (PAN-FPN C3k2)
# =========================
head:
  # Top-down Path (P5 -> P4)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12 (Concat layer 11 & P4 layer 6)
  - [-1, 2, C3k2, [512, False]]                # 13

  # Top-down Path (P4 -> P3)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15 (Concat layer 14 & P3 layer 4)
  - [-1, 2, C3k2, [256, False]]                # 16 <-- Small Object Detect Head (P3)

  # Bottom-up Path (P3 -> P4)
  - [-1, 1, Conv, [256, 3, 2]]               # 17
  - [[-1, 13], 1, Concat, [1]]                 # 18 (Concat layer 17 & P4 layer 13)
  - [-1, 2, C3k2, [512, False]]                # 19 <-- Medium Object Detect Head (P4)

  # Bottom-up Path (P4 -> P5)
  - [-1, 1, Conv, [512, 3, 2]]               # 20
  - [[-1, 10], 1, Concat, [1]]                 # 21 (Concat layer 20 & P5 output layer 10)
  - [-1, 2, C3k2, [1024, True]]                # 22 <-- Large Object Detect Head (P5)

  # Final Detection Head
  - [[16, 19, 22], 1, Detect, [nc]]            # 23 Output (P3, P4, P5)