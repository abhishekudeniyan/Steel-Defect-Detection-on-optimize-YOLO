nc: 6

scales:
  n: [0.33, 0.25, 1024]

# =========================
# BACKBONE (YOLOv11-style)
# =========================
backbone:

  # Stem
  - [-1, 1, Conv, [64, 3, 2]]          # 0: 3 → 64

  # P2
  - [-1, 1, SPDConv, [128]]            # 1: 64 → 128
  - [-1, 2, C3k2, [128, True]]         # 2

  # P3
  - [-1, 1, SPDConv, [256]]            # 3: 128 → 256
  - [-1, 4, C3k2, [256, True]]         # 4  ← P3

  # P4
  - [-1, 1, SPDConv, [512]]            # 5: 256 → 512
  - [-1, 4, C3k2, [512, True]]         # 6  ← P4

  # P5
  - [-1, 1, SPDConv, [1024]]           # 7: 512 → 1024
  - [-1, 2, C3k2, [1024, True]]        # 8

  # Attention (YOLOv11 improvement)
  - [-1, 1, C2PSA, [1024]]             # 9

  # SPPF
  - [-1, 1, SPPF, [1024, 5]]           # 10


# =========================
# HEAD (PAN-FPN improved)
# =========================
head:

  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 2, C3k2, [512]]                       # 13

  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [256]]                      # 16 ← P3

  # P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                # 17
  - [[-1, 13], 1, Concat, [1]]                # 18
  - [-1, 2, C3k2, [512]]                     # 19 ← P4

  # P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]               # 20
  - [[-1, 10], 1, Concat, [1]]               # 21
  - [-1, 2, C3k2, [1024]]                   # 22 ← P5

  # Detect
  - [[16, 19, 22], 1, Detect, [nc]]