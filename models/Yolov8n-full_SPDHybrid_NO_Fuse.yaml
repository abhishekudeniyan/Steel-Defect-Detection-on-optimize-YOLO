# # YOLOv8n Hybrid (Fixed & Stable)


# models/yolov8n_full_SPDHybrid_NO_Fuse.yaml

nc: 6

scales:
  n: [0.33, 0.25, 1024]

backbone:
  # Keep first conv (important)
  - [-1, 1, Conv, [64, 3, 2]]

  # 🔥 Replace all downsampling
  - [-1, 1, SPDHybrid_NO_Fuse, [128]]      # 16 → 32
  - [-1, 3, C2f, [128, True]]

  - [-1, 1, SPDHybrid_NO_Fuse, [256]]      # 32 → 64
  - [-1, 6, C2f, [256, True]]

  - [-1, 1, SPDHybrid_NO_Fuse, [512]]      # 64 → 128
  - [-1, 6, C2f, [512, True]]

  - [-1, 1, SPDHybrid_NO_Fuse, [1024]]     # 128 → 256
  - [-1, 3, C2f, [1024, True]]

  - [-1, 1, SPPF, [1024, 5]]


head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]




